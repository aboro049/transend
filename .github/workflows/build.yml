# Build and push the seed-vc server image from GitHub's runners.
#
# Why not build locally: the image is 12-15 GB. Pushing that from a home
# connection at ~34 Mbps takes about an hour and saturates the link while
# it runs. GitHub builds and pushes inside a datacentre in ~10-15 minutes.
#
# Setup:
#   1. Docker Hub > Account Settings > Personal Access Tokens > generate
#   2. This repo > Settings > Secrets and variables > Actions > add
#      DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
#   3. Push to main, or run manually from the Actions tab

name: build-seedvc-server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        default: 'latest'

env:
  IMAGE_NAME: seedvc-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Default runners have ~14 GB free. This image needs more, and the
      # failure mode is an unhelpful "no space left on device" deep into
      # the build, so reclaim first.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android
          sudo apt-get clean
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag || 'latest' }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Layer cache: a change to app.py then rebuilds in ~2 min instead
          # of re-downloading the weights.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo '`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag || 'latest' }}`' >> $GITHUB_STEP_SUMMARY
          echo "Deploy on Runpod: Custom image, expose HTTP port 8000." >> $GITHUB_STEP_SUMMARY
